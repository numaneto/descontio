{% extends "base.html" %}
{% block content %}
<form class="filters" method="get" action="/">
    <input type="text" name="q" placeholder="Buscar produto..." value="{{ q }}">
    <select name="source_group">
        <option value="">Todos os grupos</option>
        {% for group_id, label in groups %}
        <option value="{{ group_id }}" {% if group_id == source_group %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
    <select name="days">
        <option value="">Qualquer data</option>
        <option value="1" {% if days == 1 %}selected{% endif %}>Últimas 24h</option>
        <option value="7" {% if days == 7 %}selected{% endif %}>Últimos 7 dias</option>
        <option value="30" {% if days == 30 %}selected{% endif %}>Últimos 30 dias</option>
    </select>
    <button type="submit">Filtrar</button>
</form>

<div class="offer-grid">
    {% for offer in offers %}
        {% include "partials/offer_card.html" %}
    {% else %}
        <p class="empty">Nenhuma oferta encontrada ainda — configure os workers de ingestão.</p>
    {% endfor %}
</div>
{% endblock %}
