{% extends "base.html" %}
{% block content %}
<form class="filters" method="get" action="/">
    <input type="text" name="q" placeholder="Buscar produto..." value="{{ q }}">
    <select name="category">
        <option value="">Todas as categorias</option>
        {% for item in categories %}
        <option value="{{ item.slug }}" {% if item.slug == category %}selected{% endif %}>{{ item.name }}</option>
        {% endfor %}
    </select>
    <select name="days">
        <option value="">Qualquer data</option>
        {% for preset in days_presets %}
        <option value="{{ preset }}" {% if days == preset %}selected{% endif %}>
            {% if preset == 1 %}Últimas 24h{% else %}Últimos {{ preset }} dias{% endif %}
        </option>
        {% endfor %}
    </select>
    <input type="text" inputmode="decimal" name="price_min" placeholder="Preço mín. (ex.: 1.000,00)" value="{{ price_min }}">
    <input type="text" inputmode="decimal" name="price_max" placeholder="Preço máx. (ex.: 5.000,00)" value="{{ price_max }}">
    <button type="submit">Filtrar</button>
</form>

<div class="offer-grid">
    {% for offer in offers %}
        {% include "partials/offer_card.html" %}
    {% else %}
        <p class="empty">Nenhuma oferta encontrada.</p>
    {% endfor %}
</div>
{% endblock %}
