<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}descont.io{% endblock %}</title>
    <meta name="description" content="Ofertas e descontos de diversas fontes, em um único portal e API.">

    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.webmanifest">

    <meta property="og:type" content="website">
    <meta property="og:title" content="descont.io">
    <meta property="og:description" content="Ofertas e descontos de diversas fontes, em um único portal e API.">
    <meta property="og:image" content="/static/og-image.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="bg-glow"></div>
    <header class="topbar">
        <a class="brand" href="/">
            <img class="brand-icon" src="/static/brand/icon.png" alt="" width="32" height="32">
            <span class="brand-name">descont<span class="brand-name-accent">.io</span></span>
        </a>
        <p class="subtitle">Ofertas e descontos, organizados em um só lugar</p>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
