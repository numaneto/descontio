# Canais/grupos monitorados. Copie para config/channels.yaml e edite —
# esse arquivo de exemplo NÃO deve conter grupos/canais reais.
#
# platform: "telegram"
# chat_id:  ID numérico do chat ou @username do canal público.
# label:    nome interno da origem (não é exibido no portal público).
# category: opcional, categoria default se o parser não conseguir inferir.

channels:
  - platform: telegram
    chat_id: "@exemplo_promocoes_tech"
    label: "Exemplo Promoções Tech"
    category: "eletronicos"
